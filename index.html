<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Alvo</title>
</head>
<body>
    <!-- Correção: Atributos dentro da tag e fechamento correto -->
    <canvas width="600" height="400" style="border: 1px solid black;"></canvas>

    <script>
        let tela = document.querySelector("canvas");
        let pincel = tela.getContext("2d");
        let raio = 10;
        let xAleatorio;
        let yAleatorio;

        function desenhaCirculo(x, y, raio, cor) {
            pincel.fillStyle = cor;
            pincel.beginPath();
            pincel.arc(x, y, raio, 0, 2 * Math.PI);
            pincel.fill();
        }

        function limpaTela() {
            pincel.clearRect(0, 0, 600, 400);
            // Opcional: Redesenha o fundo azul para o alvo não sumir no branco
            pincel.fillStyle = "lightgray"; 
            pincel.fillRect(0, 0, 600, 400);
        }

        function desenhaAlvo(x, y) { // Corrigido o nome da função
            desenhaCirculo(x, y, raio + 20, 'red');
            desenhaCirculo(x, y, raio + 10, 'white');
            desenhaCirculo(x, y, raio, 'red');
        }

        function sorteaPosicao(maximo) {
            return Math.floor(Math.random() * maximo);
        }

        function atualizaTela() {
            limpaTela();
            xAleatorio = sorteaPosicao(600);
            yAleatorio = sorteaPosicao(400);
            desenhaAlvo(xAleatorio, yAleatorio);
        }

        function dispara(evento) {
            let x = evento.pageX - tela.offsetLeft;
            let y = evento.pageY - tela.offsetTop;

            if (((x >= xAleatorio - raio) && (x <= xAleatorio + raio)) && 
                ((y >= yAleatorio - raio) && (y <= yAleatorio + raio))) {
                alert('ACERTOU!');
            }
        }

        tela.onclick = dispara;
        setInterval(atualizaTela, 1000);
    </script>
</body>
</html>
